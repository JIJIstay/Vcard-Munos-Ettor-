<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte de Visite - Ettoré Munos</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f5f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 350px;
      width: 100%;
    }
    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #0071e3;
      color: white;
      font-size: 36px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px auto;
    }
    h1 { font-size: 24px; color: #1d1d1f; margin: 0 0 5px 0; }
    .subtitle { font-size: 15px; color: #86868b; margin-bottom: 20px; }
    .info-list {
      text-align: left;
      background: #f5f5f7;
      padding: 15px;
      border-radius: 14px;
      margin-bottom: 20px;
    }
    .info-item {
      font-size: 14px;
      color: #1d1d1f;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .info-item:last-child { margin-bottom: 0; }
    .info-item a { color: #0071e3; text-decoration: none; }
    
    /* Boutons de réseaux sociaux */
    .social-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    .social-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      background-color: #f5f5f7;
      color: #1d1d1f;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #d2d2d7;
      transition: background 0.2s;
    }
    .social-btn:hover { background-color: #e8e8ed; }

    /* Boutons principaux */
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background-color: #0071e3;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      box-sizing: border-box;
      margin-top: 10px;
    }
    .btn-secondary {
      background-color: #e8e8ed;
      color: #1d1d1f;
    }
    .btn:active { opacity: 0.9; }

    /* Style du bloc QR Code caché par défaut */
    .qr-section {
      display: none;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #e8e8ed;
    }
    .qr-section img {
      width: 160px;
      height: 160px;
      border-radius: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar" id="avatar-initials">EM</div>

    <h1 id="display-name">Prénom Nom</h1>
    <div class="subtitle" id="display-title">Titre / Activité</div>

    <div class="info-list">
      <div class="info-item">📞 <a id="link-phone" href="#">Téléphone</a></div>
      <div class="info-item">✉️ <a id="link-email" href="#">Email</a></div>
      <div class="info-item">📍 <span id="display-location">Ville</span></div>
    </div>

    <!-- BOUTONS RÉSEAUX SOCIAUX INTÉGRÉS -->
    <div class="social-container">
      <a href="https://www.instagram.com/jiji__stay?exln=MW5zZTBxdnR3a2x1OQ%3D%3D&utm_source=qr" target="_blank" class="social-btn">📷 Instagram</a>
      <a href="https://wa.me/qr/RV7VKQYACJOCN1?s=p" target="_blank" class="social-btn">💬 WhatsApp</a>
    </div>

    <!-- BOUTON ENREGISTRER CONTACT -->
    <button class="btn" onclick="downloadVCard()">Enregistrer le contact</button>

    <!-- BOUTON PARTAGER LA CARTE -->
    <button class="btn btn-secondary" onclick="shareCard()">Partager la carte 📤</button>

    <!-- BOUTON AFFICHER LE QR CODE -->
    <button class="btn btn-secondary" onclick="toggleQRCode()">Afficher mon QR Code 📱</button>

    <!-- SECTION QR CODE (Généré automatiquement) -->
    <div id="qr-container" class="qr-section">
      <p style="font-size: 13px; color: #86868b; margin: 0;">Flashez cette carte :</p>
      <img id="qr-img" src="" alt="QR Code de la page">
    </div>
  </div>

  <script>
    // --- TES INFORMATIONS ---
    const contactData = {
      firstName: "Ettoré",
      lastName: "Munos",
      phone: "+33659826808",
      email: "ettoremunos89@gmail.com",
      title: "Lycéen et ice skater",
      city: "Chamvres 89300 France"
    };

    // Mise à jour automatique des textes
    document.getElementById('display-name').textContent = `${contactData.firstName} ${contactData.lastName}`;
    document.getElementById('display-title').textContent = contactData.title;
    document.getElementById('display-location').textContent = contactData.city;
    
    document.getElementById('link-phone').textContent = contactData.phone;
    document.getElementById('link-phone').href = `tel:${contactData.phone}`;
    
    document.getElementById('link-email').textContent = contactData.email;
    document.getElementById('link-email').href = `mailto:${contactData.email}`;

    const initials = (contactData.firstName.charAt(0) + contactData.lastName.charAt(0)).toUpperCase();
    document.getElementById('avatar-initials').textContent = initials;

    // Génération automatique du QR code de la page actuelle
    const currentUrl = window.location.href;
    document.getElementById('qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(currentUrl)}`;

    // Fonction pour afficher/masquer le QR code au clic
    function toggleQRCode() {
      const qrDiv = document.getElementById('qr-container');
      if (qrDiv.style.display === 'block') {
        qrDiv.style.display = 'none';
      } else {
        qrDiv.style.display = 'block';
      }
    }

    // Fonction de partage natif
    function shareCard() {
      if (navigator.share) {
        navigator.share({
          title: 'Carte de visite de ' + contactData.firstName,
          text: 'Découvrez la carte de visite de ' + contactData.firstName + ' ' + contactData.lastName,
          url: window.location.href,
        }).catch(() => {});
      } else {
        alert("Le partage n'est pas pris en charge sur ce navigateur.");
      }
    }

    // Fonction de téléchargement vCard
    function downloadVCard() {
      const vcardContent = 
`BEGIN:VCARD
VERSION:3.0
N:${contactData.lastName};${contactData.firstName};;;
FN:${contactData.firstName} ${contactData.lastName}
TITLE:${contactData.title}
TEL;TYPE=CELL:${contactData.phone}
EMAIL;TYPE=INTERNET:${contactData.email}
ADR;TYPE=HOME:;;;${contactData.city};;;
END:VCARD`;

      const blob = new Blob([vcardContent], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', `${contactData.firstName}_${contactData.lastName}.vcf`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>

</body>
</html>
